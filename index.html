<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8fafc;
        }
        h1 {
            color: #1e293b;
        }
        table {
            border-collapse: collapse;
            width: 70%;
            min-width: 500px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            text-align: left;
        }
        th {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 15px;
        }
        tr:nth-child(even) {
            background-color: #f1f5f9;
        }
        tr:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>

    <table border="1">
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Laptop Dell XPS 13</td>
            <td>28.500.000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Điện thoại iPhone 15 Pro</td>
            <td>25.990.000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Tai nghe Sony WH-1000XM5</td>
            <td>6.890.000 VNĐ</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Bàn phím cơ Logitech MX Mechanical</td>
            <td>3.290.000 VNĐ</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Chuột không dây Logitech MX Master 3S</td>
            <td>2.190.000 VNĐ</td>
            <td>40</td>
        </tr>
    </table>
</body>
</html>
